# Run Puppet checks and test matrix on Pull Requests
# ------------------------------------------------------------------------------
#             NOTICE: **This file is maintained with puppetsync**
#
# This file is updated automatically as part of a puppet module baseline.
#
# The next baseline sync will overwrite any local changes to this file!
#
# ==============================================================================
#
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
#
---
name: PR Tests
'on':
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  puppet-syntax:
    name: 'Puppet Syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1  # ruby/setup-ruby@ec106b438a1ff6ff109590de34ddc62c540232e0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: "bundle exec rake syntax"

  puppet-style:
    name: 'Puppet Style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: "bundle exec rake lint"
      - run: "bundle exec rake metadata_lint"

  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: |
          bundle show
          bundle exec rake rubocop

  file-checks:
    name: 'File checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: bundle exec rake check:dot_underscore
      - run: bundle exec rake check:test_file

  reference:
    name: 'REFERENCE.md freshness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: 'Check REFERENCE.md freshness'
        run: bundle exec rake validate:strings

  releng-checks:
    name: 'RELENG checks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: 'Tags and changelogs'
        run: |
          bundle exec rake pkg:check_version
          bundle exec rake pkg:compare_latest_tag[,true]
          bundle exec rake pkg:create_tag_changelog
      - name: 'Test-build the Puppet module'
        run: 'bundle exec rake pupmod:build'

  spec-tests:
    name: 'Spec (${{matrix.test_suite.label}}, ${{matrix.puppet.label}})'
    needs: [puppet-syntax]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        puppet:
          # openvox 8 accepts openfact 6, but no OpenVox 8 AIO package ships
          # it, so pin the openfact the agent actually ships
          - label: 'OpenVox 8.x (Ruby 3.2)'
            puppet_version: '~> 8.0'
            openfact_version: '~> 5.0'
            ruby_version: '3.2.11'  # renovate: datasource=ruby-version depName=ruby
            experimental: false
          - label: 'OpenVox 9.x (Ruby 4.0)'
            puppet_version: '~> 9.0'
            openfact_version: '~> 6.0'
            ruby_version: '4.0.9'  # renovate: datasource=ruby-version depName=ruby
            experimental: false
        test_suite:
          - label: classes 01
            run: bundle exec rspec spec/classes/01_classes
          - label: classes 10
            run: bundle exec rspec spec/classes/10_classes
          - label: classes 20
            run: bundle exec rspec spec/classes/20_classes
          - label: classes 00
            run: bundle exec rspec spec/classes/00_classes
          - label: facter
            run: bundle exec rspec spec/facter
          - label: functions
            run: bundle exec rspec spec/functions
          - label: aliases
            run: bundle exec rspec spec/type_aliases
      fail-fast: false
    env:
      PUPPET_VERSION: ${{matrix.puppet.puppet_version}}
      OPENFACT_VERSION: ${{matrix.puppet.openfact_version}}
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby ${{matrix.puppet.ruby_version}}'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.puppet.ruby_version}}
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - run: 'bundle exec rake spec_prep'
      - run: ${{matrix.test_suite.run}}
        continue-on-error: ${{matrix.puppet.experimental}}

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded, so the required list never has to track job or matrix
  # names. Add new jobs to `needs:`; puppetsync drops a job a repo doesn't
  # have (e.g. acceptance) from the list.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - puppet-syntax
      - puppet-style
      - ruby-style
      - file-checks
      - reference
      - releng-checks
      - spec-tests
      - acceptance
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null

  acceptance:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        node:
          - almalinux8
          - almalinux9
          - almalinux10
        suite:
          - default
          - base_apps
      fail-fast: false
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: bundle install
        run: |
          bundle install
      - name: Choose the Vagrant packages
        id: vagrant-debs
        run: |
          # ppa:evgeni/vagrant has vagrant 2.3.7 (the last MPL-licensed
          # release) and a matching vagrant-libvirt for the Ubuntu series in
          # ppa_series; Ubuntu dropped both after 23.10. HashiCorp's apt
          # repository and rubygems.org are the fallback when the PPA is down
          # and the cache is cold, and the only source on other series.
          ppa_series='noble'
          ppa_vagrant='2.3.7+git20230731.5fc64cde+dfsg-2~ppa+1'
          ppa_vagrant_libvirt='0.12.2-1~ppa+1'
          . /etc/os-release
          {
            if [[ " ${ppa_series} " == *" ${VERSION_CODENAME} "* ]]; then
              echo 'ppa=true'
            else
              echo 'ppa=false'
            fi
            echo "ppa-vagrant=${ppa_vagrant}"
            echo "ppa-vagrant-libvirt=${ppa_vagrant_libvirt}"
            echo 'hashicorp-vagrant=2.4.9-1'
            echo 'vagrant-libvirt-plugin=0.12.2'
            echo "codename=${VERSION_CODENAME}"
            echo "dir=${RUNNER_TEMP}/vagrant-debs"
            echo "key=vagrant-debs-${VERSION_CODENAME}-$(dpkg --print-architecture)-${ppa_vagrant}-${ppa_vagrant_libvirt}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the cached Vagrant packages
        id: vagrant-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.vagrant-debs.outputs.dir }}
          key: ${{ steps.vagrant-debs.outputs.key }}
      - name: Setup libvirt for Vagrant
        id: vagrant-setup
        env:
          CACHE_HIT: ${{ steps.vagrant-cache.outputs.cache-hit }}
          CODENAME: ${{ steps.vagrant-debs.outputs.codename }}
          DEBS: ${{ steps.vagrant-debs.outputs.dir }}
          PPA: ${{ steps.vagrant-debs.outputs.ppa }}
          PPA_VAGRANT: ${{ steps.vagrant-debs.outputs.ppa-vagrant }}
          PPA_VAGRANT_LIBVIRT: ${{ steps.vagrant-debs.outputs.ppa-vagrant-libvirt }}
          HASHICORP_VAGRANT: ${{ steps.vagrant-debs.outputs.hashicorp-vagrant }}
          VAGRANT_LIBVIRT_PLUGIN: ${{ steps.vagrant-debs.outputs.vagrant-libvirt-plugin }}
        run: |
          # Up to three attempts, 30s and then 60s apart
          retry() {
            for delay in 30 60 0; do
              "$@" && return 0
              if [ "$delay" -eq 0 ]; then
                return 1
              fi
              echo "::notice::Retrying in ${delay}s: $*"
              sleep "$delay"
            done
          }

          from_ppa() {
            retry sudo add-apt-repository -y -n ppa:evgeni/vagrant &&
              retry sudo apt-get update --error-on=any &&
              mkdir -p "$DEBS" &&
              (cd "$DEBS" && retry apt-get download "vagrant=${PPA_VAGRANT}" "vagrant-libvirt=${PPA_VAGRANT_LIBVIRT}")
          }

          packages=(libvirt-daemon-system libvirt-daemon qemu-system-x86 qemu-utils dnsmasq)
          if [ "$CACHE_HIT" = 'true' ]; then
            source=cache
            retry sudo apt-get update --error-on=any
          elif [ "$PPA" = 'true' ] && from_ppa; then
            source=ppa
          else
            source=hashicorp
            fallback="BSL-licensed Vagrant ${HASHICORP_VAGRANT} from HashiCorp and vagrant-libvirt ${VAGRANT_LIBVIRT_PLUGIN} from rubygems.org"
            if [ "$PPA" = 'true' ]; then
              echo "::warning::ppa:evgeni/vagrant is unavailable, so this job uses ${fallback}"
              sudo add-apt-repository -y -n -r ppa:evgeni/vagrant || true
              rm -rf "$DEBS"
            else
              echo "::notice::ppa:evgeni/vagrant has no packages for Ubuntu ${CODENAME}, so this job uses ${fallback}"
            fi
            retry curl -fsSL -o "${RUNNER_TEMP}/hashicorp.asc" https://apt.releases.hashicorp.com/gpg
            sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg "${RUNNER_TEMP}/hashicorp.asc"
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${CODENAME} main" |
              sudo tee /etc/apt/sources.list.d/hashicorp.list
            retry sudo apt-get update --error-on=any
            packages+=("vagrant=${HASHICORP_VAGRANT}" libvirt-dev build-essential pkg-config)
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

          if [ "$source" = 'hashicorp' ]; then
            retry sudo apt-get install -y --no-install-recommends "${packages[@]}"
            retry vagrant plugin install vagrant-libvirt --plugin-version "$VAGRANT_LIBVIRT_PLUGIN"
          else
            retry sudo apt-get install -y --no-install-recommends "$DEBS"/*.deb "${packages[@]}"
          fi
          sudo chmod 666 /var/run/libvirt/libvirt-sock
      - name: Cache the Vagrant packages
        if: steps.vagrant-setup.outputs.source == 'ppa'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vagrant-debs.outputs.dir }}
          key: ${{ steps.vagrant-debs.outputs.key }}
      - name: beaker
        env:
          BEAKER_HYPERVISOR: 'vagrant_libvirt'
          VAGRANT_DEFAULT_PROVIDER: 'libvirt'
        run: |
          bundle exec rake beaker:suites[${{ matrix.suite}},${{ matrix.node }}]
